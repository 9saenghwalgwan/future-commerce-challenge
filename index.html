<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALGOSA (알고사)</title><link rel="stylesheet" href="prototype.css"></head><body>
<header><strong>ALGOSA (알고사)</strong><span id="mode-label">FUTURE COMMERCE CHALLENGE · TRACK A</span><button id="fullscreen">전체 화면 ↗</button></header>
<main id="presentation" tabindex="-1"></main>
<section id="demo" hidden aria-label="인터랙티브 쇼핑 프로토타입">
  <div class="demo-bar"><div><span class="eyebrow">LIVE PROTOTYPE</span><h1>내게 맞는지 알고, 진짜 가격을 알고 사요.</h1></div><div class="demo-tools"><span>흐름 시연 · 실제 검색 미연결</span><button id="previous-step" hidden>← 이전 단계</button><button id="reset">다시 시연</button></div></div>
  <div id="chat-screen"></div>
  <div id="viewport" hidden aria-label="현재 단계에 자동으로 맞춰지는 쇼핑 그래프"><div id="world"></div></div>
  <div class="canvas-caption"><span id="journey-status">원하는 사용 경험을 이야기해주세요.</span><span id="camera-hint" hidden>현재 단계와 선택지에 화면이 자동으로 맞춰집니다.</span></div>
</section>
<footer class="deck-nav"><button id="deck-back">← 이전</button><div><span id="page-label"></span><span id="page-count"></span></div><button id="deck-next">다음 →</button></footer><div id="announcement" class="sr-only" aria-live="polite"></div><script src="prototype.js"></script></body></html>
