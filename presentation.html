 });
 if(state.max>=4&&state.working!==4){const source=nodes[4],{bx,by}=g4;
  [0,1,2].forEach(i=>{const y=by+i*165;paths.push(link({x:source.x+source.w,y:source.y+35},{x:bx,y:y+40},freshGroup===4));parts.push(`<section class="graph-node branch-node ${i===0?'selected':''} ${freshGroup===4?'enter':''}" data-branch-group="4" style="left:${bx}px;top:${y}px;animation-delay:${i*.12}s"><div class="branch-body"><div class="branch-label">제품 후보 0${i+1}</div><h3>${i===0?'UGREEN KVM':'후보 미정'}</h3><p>${i===0?'모델 번호 확인 필요':'구상안의 제품 자리'}</p>${i===0?'<button id="product-open">구매 경로 살펴보기 →</button>':''}</div></section>`);});x=Math.max(x,bx+BW);
 }
 if(state.max>=5&&state.working!==5){const source=nodes[5],bx=slotX(5)+S+90;let y=30;
  [1,2,3].forEach(i=>{paths.push(link({x:source.x+source.w,y:source.y+35},{x:bx,y:y+40},freshGroup===5));parts.push(`<section class="graph-node branch-node ${freshGroup===5?'enter':''}" data-branch-group="5" style="left:${bx}px;top:${y}px;animation-delay:${(i-1)*.12}s"><div class="branch-body"><div class="branch-label">구매 옵션 0${i}</div><h3>구매 옵션 ${i}</h3><button data-route="${i}" aria-expanded="${state.route===i}">${state.route===i?'접기 −':'상세 보기 ＋'}</button>${state.route===i?'<div class="route-fields">구매처: 확인 필요<br>가격: 확인 필요<br>결제 혜택: 확인 필요</div>':''}</div></section>`);y+=state.route===i?250:165;});x=Math.max(x,bx+BW);
 }
 x+=300;
 const height=900;$('#world').style.width=`${x}px`;$('#world').style.height=`${height}px`;
 $('#world').innerHTML=`<svg class="links" width="${x}" height="${height}" aria-hidden="true">${paths.map(p=>`<path class="${p.fresh?'fresh':''}" d="${p.d}"/>`).join('')}</svg>${parts.join('')}`;
 document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openStep(+el.dataset.open));
 if($('#node-next'))$('#node-next').onclick=advance;
 document.querySelectorAll('[data-solution]').forEach(el=>el.onclick=()=>{state.solution=el.dataset.solution;if(state.solution==='software')state.max=1;renderGraph(false);});
 document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{state.tab=el.dataset.tab;renderGraph(false);});
 document.querySelectorAll('[data-move]').forEach(el=>el.onclick=()=>{save();const [i,d]=el.dataset.move.split(',').map(Number);[state.priorities[i],state.priorities[i+d]]=[state.priorities[i+d],state.priorities[i]];renderGraph(false);});
 if($('#product-open'))$('#product-open').onclick=()=>goForward(5);
 document.querySelectorAll('[data-route]').forEach(el=>el.onclick=()=>{state.route=state.route===+el.dataset.route?0:+el.dataset.route;renderGraph(false);});
 $('#previous-step').disabled=state.step===0;
 $('#journey-status').textContent=`${String(state.step+1).padStart(2,'0')} / 06 · ${titles[state.step]}${state.working!=null?' · 에이전트 조사 중':''}`;
 updatePin();
 if(expandMode!=null){playExpand($('.graph-node.active'),expandMode);expandMode=null;}
 scheduleCamera(true);$('#announcement').textContent=titles[state.step];
}
$('#previous-step').onclick=()=>{if(state.step>0)openStep(state.step-1);};
$('#reset').onclick=()=>{cancelLoading();cancelWork();freshGroup=null;navBusy=false;expandMode=null;state=defaults();$('#world').style.transform='';renderDemo();};
$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{$('#announcement').textContent='브라우저의 F11 키를 사용해주세요.';}};
document.addEventListener('fullscreenchange',()=>{$('#fullscreen').textContent=document.fullscreenElement?'전체 화면 종료 ↙':'전체 화면 ↗';scheduleCamera(false);});
window.addEventListener('resize',()=>scheduleCamera(false));

/* ---------- 장표 이동: 데모(8) 뒤에도 장표가 이어진다 ---------- */
function updatePin(){updateMinimap();const p=$('#cond-pin');if(!p)return;p.hidden=!(slide===DEMO&&state.phase==='graph'&&state.max>=4);p.querySelector('span').textContent=state.monitor;}
function nextLabel(n){if(n===REVEAL&&!reveal)return '사용자의 생각 보기 →';if(n===DEMO-1)return '프로토타입 시작 →';if(n===DEMO)return '결정 보드 →';return '다음 →';}
function showSlide(n,keepReveal){save();if(n!==DEMO&&state.phase==='loading'){cancelLoading();state.phase='chat';}if(n!==DEMO)cancelWork();if(!keepReveal)reveal=0;slide=n;const demo=n===DEMO;$('#presentation').hidden=demo;$('#demo').hidden=!demo;$('#deck-back').disabled=n===0;$('#deck-next').style.visibility=n===LAST?'hidden':'';$('#deck-next').textContent=nextLabel(n);$('#page-label').textContent=labels[n];$('#page-count').textContent=`${String(n+1).padStart(2,'0')} / ${slides.length}`;$('#mode-label').textContent=demo?'PROTOTYPE · KVM SHOPPING':'FUTURE COMMERCE CHALLENGE · TRACK A';if(!demo){$('#presentation').innerHTML=`<section class="slide s${n+1}">${slides[n]()}</section>`;$('#presentation').scrollTop=0;}else renderDemo();}
function deckNext(){if(slide===REVEAL&&!reveal){reveal=1;$('.imagine-layout').classList.add('revealed');$('#deck-next').textContent=nextLabel(slide);$('#announcement').textContent='사용자의 의문이 나타났습니다.';return;}if(slide<LAST)showSlide(slide+1);}
function deckBack(){if(slide===0)return;if(slide-1===REVEAL){reveal=1;showSlide(REVEAL,true);}else showSlide(slide-1);}
$('#deck-next').onclick=deckNext;
$('#deck-back').onclick=deckBack;
document.addEventListener('keydown',e=>{const t=e.target&&e.target.matches?e.target:document.body;if(t.matches('input,textarea')||e.ctrlKey||e.metaKey||e.altKey)return;const onButton=t.matches('button');
 if(['ArrowRight','PageDown'].includes(e.key)||(e.key===' '&&!onButton&&slide!==DEMO)){e.preventDefault();deckNext();}
 else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();deckBack();}
 else if(e.key==='Home')showSlide(0);else if(e.key==='End')showSlide(LAST);});
/* ---------- 미니맵 + 가격 비교 보드: 데모 창 안에서 바로 이어진다 ---------- */
let boardOpen=false;
const stops=['질문','해결책','이해','내 조건','후보','가격 조사','진짜 가격','내가 결제'];
function updateMinimap(){const m=$('#minimap');if(!m)return;const on=slide===DEMO&&state.phase==='graph';m.hidden=!on;if(!on)return;const cur=boardOpen?6:state.step;
 m.innerHTML=stops.map((s,i)=>{const can=(i<=state.max&&i<=5)||(i===6&&state.max>=5);return `<button class="ms ${i<cur?'done':i===cur?'cur':''}" data-go="${i}" ${can?'':'disabled'}><i>${i<cur?'✓':i===7?'■':i+1}</i><span>${s}</span></button>`;}).join('');
 m.querySelectorAll('.ms:not(:disabled)').forEach(b=>b.onclick=()=>{const i=+b.dataset.go;if(i===6){openBoard();return;}closeBoard();openStep(i);});}
function openBoard(){boardOpen=true;$('#board-iframe').src='prototype/price-compare-kvm.html?play=1';$('#board-overlay').hidden=false;updateMinimap();$('#journey-status').textContent='07 / 07 · 진짜 가격 비교 · 결제 버튼 직전에서 멈춤';}
function closeBoard(){if(!boardOpen)return;boardOpen=false;$('#board-overlay').hidden=true;updateMinimap();}
document.addEventListener('click',e=>{if(e.target.closest('#open-board'))openBoard();else if(e.target.closest('#board-close,#reset,#previous-step'))closeBoard();});
/* ?slide=N 으로 해당 장표에서 시작, ?demo=K 는 그래프 K단계까지 펼친 상태(캡처용) */
const query=new URLSearchParams(location.search);
if(query.get('demo')){const k=Math.min(5,Math.max(1,+query.get('demo')||1));state.phase='graph';state.question=exampleQuestion;state.step=k;state.max=k;}
if(query.get('reveal'))reveal=1;
showSlide(Math.min(LAST,Math.max(0,(+query.get('slide')||1)-1)),true);
if(query.get('audit'))addEventListener('load',()=>{const out=[];slides.forEach((s,i)=>{if(i===DEMO)return;reveal=1;showSlide(i,true);const p=$('#presentation'),sl=p.firstElementChild;let r=0,l=9999;sl.querySelectorAll('*').forEach(e=>{const b=e.getBoundingClientRect();if(b.width){r=Math.max(r,b.right);l=Math.min(l,b.left);}});out.push(`${i+1}:h${p.scrollHeight}/${p.clientHeight} c${sl.offsetHeight} x${Math.round(l)}-${Math.round(r)}/${innerWidth}`);});document.body.insertAdjacentHTML('beforeend',`<pre id="audit">AUDIT ${out.join(' | ')}</pre>`);});

</script></body></html>
